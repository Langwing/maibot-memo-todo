# ============================================================
# 备忘录待办插件 配置说明
# 直接改本文件或网页后台改都行，保存后生效方式：
#   网页后台改=立即生效；改本文件=重启麦麦后生效
# ============================================================

# 插件总开关（true 开 / false 关）
enabled = true

# 白名单：允许使用备忘录的 QQ 号（一行一个）。
# ! 留空 [ ] 时谁都使用不了，要先填人 !
whitelist = [
  # "10000",
]

# 黑名单：写在这里的人，即使在白名单里也不能用
blacklist = []

# 提醒优先发私聊（true/false）。
# false = 提醒发在你当初记事的那个聊天里（群里记的就提醒到群里）
prefer_private = true

# 你来找麦麦聊天时，它顺带提一句你没做完的事（true/false）
chat_mention_enabled = true

# 顺带提醒的最小间隔（分钟）。120 = 同一个人至少隔 2 小时才再提一次，防止刷屏
chat_mention_min_gap_minutes = 120

# 顺带提醒前先等几秒再开口，显得像聊天中自然提起（秒）
chat_mention_delay_seconds = 8

# 记事时没说提醒时间的话，多久后第一次提醒（分钟）。240 = 4 小时后
first_remind_delay_minutes = 240

# 每提醒一次后，到下一次提醒的间隔（分钟），依次取用：
#   240（4小时）→ 720（12小时）→ 1440（每天一次，之后一直每天）
# 直到事情被做完为止。想更催命就改小，想更佛系就改大
remind_backoff_minutes = [240, 720, 1440]

# 一个人最多同时挂多少条没做完的待办
max_todos_per_user = 30

# 全部人加起来最多多少条（防撑爆）
max_total_todos = 300

# ------------------------------------------------------------
# 下面的 [todos] 就是备忘录本体：每条待办一个小表。
# 直接在网页后台（插件管理 → 备忘录待办 → 配置）里增删改最方便；
# 手动编辑时照着格式抄一条即可，编号（mXXXX）别和已有重复。
# 想手动推迟/提前某条的下次提醒，改它的 next_remind_at 时间戳即可
# （时间戳换算：网页搜"unix 时间戳"，东八区时间）
# ------------------------------------------------------------

[plugin]
# 系统用的配置版本号，别改
config_version = "1.0.0"

# 待办清单表（一条待办的示例，正式使用由插件自动生成/网页后台维护）：
# [todos.m1a2b]
# user_id = "10000"              # 谁的待办（QQ 号）
# content = "买牛奶"             # 待办内容
# note = ""                      # 备注，可空
# user_nickname = "小明"         # 昵称，可空
# platform = "qq"                # 一般不动
# source_stream_id = ""          # 一般不动
# created_at = 1761000000.0      # 创建时间戳，不用管
# done = false                   # 改成 true = 已完成，不再提醒
# done_at = 0.0                  # 不用管
# remind_count = 0               # 已提醒次数
# last_reminded_at = 0.0         # 不用管
# next_remind_at = 1761002400.0  # 下次提醒时间戳，想推迟就改大一点

[todos]
